  name: Postman collection workflow

  on:
    push:
      branches: [main]
    workflow_dispatch:
    schedule:
      - cron : 30 02 * * * # 8.00 AM IST
      - cron : 00 14 * * * # 7.30 PM IST

  jobs:
    run-postman-test:
     runs-on: ubuntu-latest

     steps:
      - name: Checkout the code
        uses: actions/checkout@v6.1.0

      - name: Install node.js and npm
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Install Newman and html extra
        run: |
             npm install -g newman
             npm install -g newman-reporter-htmlextra

      - name: Run the postman collection
        run: |
             newman run 'Inwarranty-flow Collection.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testdata.csv \
             -r cli,htmlextra \
             --reporter-htmlextra-export ./newman/index.html
             
      - name: Newman report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: newman report
          path: newman/*.html

      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix Inwarranty Flow Test execution Notification
          to: rrajapandi4296@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
                Hi,
                Phoenix inwarranty flow has been executed and report has been published and the URL
                is: https://raja4296.github.io/Phoenix-Inwarranty-Flow/
          
